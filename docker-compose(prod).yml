version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  app1:
    build: .
    expose:
      - "${APP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
  nginx:
    image: nginx:latest
    container_name: messenger_nginx
    depends_on:
      - app1
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data: